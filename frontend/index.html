<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus Operations Management System: announcements, accounts and academic-year administration for your campus." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f4d3f" />
    <title>Campus Operations</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("campus-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
